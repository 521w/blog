<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xiaoliang</title>
  <meta name="description" content="xiaoliang 的个人博客。雅安，AI 使用者，还在熬，也还在做事。">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#0b0b10">
  <link rel="canonical" href="https://blog.xiaoliangzou.eu.cc/">
  <meta property="og:title" content="xiaoliang">
  <meta property="og:description" content="个人博客。雅安，AI 使用者，还在熬，也还在做事。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blog.xiaoliangzou.eu.cc/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0b10'/><text x='16' y='23' font-family='serif' font-size='22' font-weight='700' fill='%23c9a96e' text-anchor='middle'>梁</text></svg>">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b10;
      --bg-soft: #111118;
      --text: #ededf2;
      --muted: #a1a1aa;
      --dim: #6f6f7a;
      --accent: #c9a96e;
      --line: rgba(237,237,242,0.08);
      --panel: rgba(237,237,242,0.035);
    }
    .light {
      color-scheme: light;
      --bg: #f7f6f2;
      --bg-soft: #efede7;
      --text: #1c1b19;
      --muted: #5d5a53;
      --dim: #938e82;
      --accent: #7d5f18;
      --line: rgba(28,27,25,0.1);
      --panel: rgba(28,27,25,0.035);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 22px 72px;
      background:
        radial-gradient(circle at 50% -10%, rgba(201,169,110,0.12), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s ease, color 0.3s ease;
    }
    a { color: inherit; }
    .wrap { width: min(100%, 680px); margin: 0 auto; }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(52px, 10vw, 92px);
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .nav-right { display: flex; align-items: center; gap: 18px; }
    .nav-links { display: flex; align-items: center; gap: 18px; }
    .nav-links a, .theme {
      color: var(--dim);
      text-decoration: none;
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .nav-links a:hover, .nav-links a.active, .theme:hover { color: var(--text); }
    .theme {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .hero { margin-bottom: clamp(56px, 9vw, 84px); }
    .kicker {
      margin: 0 0 22px;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 11ch;
      font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(42px, 11vw, 82px);
      font-weight: 650;
      line-height: 1.04;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    .lead {
      max-width: 31rem;
      margin: 28px 0 0;
      color: var(--muted);
      font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", serif;
      font-size: clamp(18px, 3.4vw, 22px);
      line-height: 1.9;
      text-wrap: pretty;
    }
    .pulse {
      display: inline-block;
      width: 0.5em;
      height: 0.5em;
      margin-right: 0.55em;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(201,169,110,0.13);
      vertical-align: 0.08em;
    }
    .grid { display: grid; gap: 42px; }
    .section { scroll-margin-top: 32px; }
    .section-title {
      margin: 0 0 16px;
      color: var(--dim);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .writing-list { list-style: none; margin: 0; padding: 0; }
    .writing-list a {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 16px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      text-decoration: none;
    }
    .writing-list li:last-child a { border-bottom: 1px solid var(--line); }
    .writing-title { font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", serif; font-size: 20px; }
    .writing-meta { color: var(--dim); font-size: 12px; }
    .writing-list a:hover .writing-title { color: var(--accent); }
    .about {
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    .about p {
      margin: 0 0 14px;
      color: var(--muted);
      font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", serif;
      font-size: 16px;
      line-height: 2;
      text-wrap: pretty;
    }
    .about p:last-child { margin-bottom: 0; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .links a {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); }
    .footer {
      margin-top: 72px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      text-align: center;
      font-size: 11px;
    }
    @media (max-width: 560px) {
      body { padding-inline: 18px; }
      .nav { align-items: flex-start; }
      .nav-right { gap: 12px; }
      .nav-links { gap: 12px; }
      .writing-list a { grid-template-columns: 1fr; gap: 4px; }
      .about { padding: 18px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav" aria-label="主导航">
      <a class="logo" href="/">xiaoliang</a>
      <div class="nav-right">
        <div class="nav-links">
          <a class="active" href="/">首页</a>
          <a href="#about">关于</a>
          <a href="/now">Now</a>
        </div>
        <button class="theme" id="theme-btn" type="button" aria-label="切换主题">☽</button>
      </div>
    </nav>

    <section class="hero" aria-labelledby="site-title">
      <p class="kicker"><span class="pulse"></span>雅安 · 还在做事</p>
      <h1 id="site-title">没有目标，活着就是目标。</h1>
      <p class="lead">INFP，AI 使用者。手还是抖的，但还在熬，也还在试着用自己能做到的方式，把日子往前推一点。</p>
    </section>

    <div class="grid">
      <section class="section" aria-labelledby="writing-title">
        <h2 class="section-title" id="writing-title">文章</h2>
        <ul class="writing-list">
          <li>
            <a href="/experience">
              <span class="writing-title">318之前</span>
              <span class="writing-meta">2026</span>
            </a>
          </li>
        </ul>
      </section>

      <section class="section" id="about" aria-labelledby="about-title">
        <h2 class="section-title" id="about-title">关于</h2>
        <div class="about">
          <p>住在雅安。离开成都之后，空气变湿了，身体还是会报警，但人慢慢能喘一口气。</p>
          <p>用 AI 工具做一些小东西，看能不能靠它们养活自己。喜欢简单、真实、能直接用的东西，讨厌把生活包装成漂亮简历。</p>
          <p>还在熬。还在等。像冬天的种子，不知道春天会不会来，但还埋在土里。</p>
          <div class="links" aria-label="链接">
            <a href="/now">现在</a>
            <a href="/experience">318之前</a>
            <a href="mailto:xiaoliang.blog@proton.me">Email</a>
          </div>
        </div>
      </section>
    </div>

    <footer class="footer">© 2026 xiaoliang. 用好奇心驱动。</footer>
  </main>

  <script>
    const body = document.body;
    const btn = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      body.classList.add('light');
      btn.textContent = '☀';
    }
    btn.addEventListener('click', () => {
      body.classList.toggle('light');
      const isLight = body.classList.contains('light');
      btn.textContent = isLight ? '☀' : '☽';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>
</body>
</html>
