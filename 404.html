<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — xiaoliang</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0b10'/><text x='16' y='23' font-family='serif' font-size='22' font-weight='700' fill='%23c9a96e' text-anchor='middle'>梁</text></svg>">
  <style>
    :root { color-scheme: dark; --bg:#0b0b10; --text:#ededf2; --muted:#a1a1aa; --dim:#6f6f7a; --accent:#c9a96e; --line:rgba(237,237,242,.08); }
    .light { color-scheme: light; --bg:#f7f6f2; --text:#1c1b19; --muted:#5d5a53; --dim:#938e82; --accent:#7d5f18; --line:rgba(28,27,25,.1); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px; background:radial-gradient(circle at 50% -10%, rgba(201,169,110,.12), transparent 34rem), var(--bg); color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; transition:background .3s ease,color .3s ease; }
    .box { width:min(100%, 520px); text-align:center; }
    .num { margin:0 0 18px; color:var(--accent); font-family:ui-serif, Georgia, "Times New Roman", "Songti SC", serif; font-size:clamp(78px,20vw,118px); line-height:.9; font-weight:650; letter-spacing:-.04em; }
    .msg { margin:0 0 40px; color:var(--muted); font-family:ui-serif, Georgia, "Times New Roman", "Songti SC", serif; font-size:17px; line-height:2; }
    .actions { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; }
    .back,.theme { border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--dim); text-decoration:none; cursor:pointer; transition:color .2s ease,border-color .2s ease; }
    .back { padding:9px 16px; font-size:12px; letter-spacing:.12em; }
    .theme { width:36px; height:36px; display:grid; place-items:center; font-size:14px; }

    .nav { position:fixed; top:24px; left:50%; transform:translateX(-50%); width:min(720px,calc(100% - 36px)); display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { color:var(--text); text-decoration:none; letter-spacing:.08em; font-size:14px; }
    .links { display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
    .links a { color:var(--muted); text-decoration:none; font-size:14px; border-bottom:1px solid transparent; }
    .links a:hover,.brand:hover { color:var(--accent); border-bottom-color:var(--accent); }
    .back:hover,.theme:hover { color:var(--accent); border-color:var(--accent); }
  </style>
</head>
<body>
  <nav class="nav" aria-label="主导航">
    <a class="brand" href="/">xiaoliang</a>
    <div class="links">
      <a href="/">首页</a>
      <a href="/more">更多</a>
      <a href="/travel">照片</a>
      <a href="/now">Now</a>
    </div>
  </nav>
  <main class="box">
    <h1 class="num">404</h1>
    <p class="msg">这个页面不在。<br>就像有些东西，你找不到了。</p>
    <div class="actions">
      <a class="back" href="/">← 回首页</a>
      <button class="theme" id="theme-btn" type="button" aria-label="切换主题">☽</button>
    </div>
  </main>
  <script>
    const body=document.body,btn=document.getElementById('theme-btn');
    if(localStorage.getItem('theme')==='light'){body.classList.add('light');btn.textContent='☀'}
    btn.addEventListener('click',()=>{body.classList.toggle('light');const l=body.classList.contains('light');btn.textContent=l?'☀':'☽';localStorage.setItem('theme',l?'light':'dark')});
  </script>
</body>
</html>
