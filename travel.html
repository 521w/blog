<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="旅行照片，按日子整理。">
  <title>旅行照片 — xiaoliang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0f'/%3E%3Ctext x='32' y='39' font-size='28' text-anchor='middle' fill='%23c9a96e' font-family='serif'%3Ex%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#0a0a0f; --panel:#111118; --text:#f2f0ea; --muted:#9b968b; --dim:#676258; --accent:#c9a96e; --line:rgba(255,255,255,.08); }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: Georgia, 'Times New Roman', 'Noto Serif SC', serif; line-height:1.85; -webkit-font-smoothing:antialiased; }
    .wrap { width:min(1080px, calc(100% - 36px)); margin:0 auto; padding:56px 0 80px; }
    .back { display:inline-block; margin-bottom:52px; color:var(--dim); text-decoration:none; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-family:Arial, sans-serif; }
    .back:hover { color:var(--accent); }
    header { max-width:680px; margin-bottom:56px; }
    .eyebrow { color:var(--accent); font-size:13px; letter-spacing:.18em; text-transform:uppercase; font-family:Arial, sans-serif; }
    h1 { font-size:clamp(40px, 8vw, 76px); line-height:1.05; margin:14px 0 22px; font-weight:500; letter-spacing:.02em; }
    .intro { color:var(--muted); font-size:17px; max-width:620px; }
    .day-block { padding:44px 0 58px; border-top:1px solid var(--line); }
    .day-head { display:grid; grid-template-columns:140px 180px 1fr; gap:24px; align-items:baseline; margin-bottom:24px; }
    .day-head p { margin:0; color:var(--dim); font-family:Arial, sans-serif; font-size:13px; letter-spacing:.08em; }
    .day-head h2 { margin:0; font-size:28px; font-weight:500; }
    .day-head span { color:var(--muted); font-size:15px; }
    .photo-grid { column-count:3; column-gap:16px; }
    .photo-card { break-inside:avoid; margin:0 0 16px; border-radius:18px; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
    .photo-card img { display:block; width:100%; height:auto; transition:transform .4s ease, filter .4s ease; }
    .photo-card:hover img { transform:scale(1.018); filter:brightness(1.05); }
    footer { border-top:1px solid var(--line); padding-top:28px; color:var(--dim); font-size:13px; }
    @media (max-width: 760px) {
      .wrap { width:min(100% - 28px, 1080px); padding-top:34px; }
      .day-head { display:block; }
      .day-head h2 { margin:6px 0; }
      .photo-grid { column-count:2; column-gap:10px; }
      .photo-card { margin-bottom:10px; border-radius:14px; }
    }
  </style>
</head>
